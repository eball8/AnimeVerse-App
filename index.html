<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f14" />
    <meta name="description" content="AnimeVerse — the all-in-one anime platform" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>AnimeVerse</title>
    <script>
      // ضبط لغة واتجاه الصفحة قبل تحميل React حتى لا يظهر اتجاه عربي لحظة فتح التطبيق بلغة أخرى
      (function () {
        try {
          var supported = ['ar', 'en', 'fr', 'es'];
          var v = localStorage.getItem('animeverse_lang');
          var code = supported.indexOf(v) >= 0 ? v : null;
          if (!code) {
            var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
            for (var i = 0; i < list.length && !code; i++) {
              var c = String(list[i] || '').toLowerCase().split('-')[0];
              if (supported.indexOf(c) >= 0) code = c;
            }
          }
          code = code || 'en';
          document.documentElement.lang = code;
          document.documentElement.dir = code === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
    <script>
      // تطبيق المظهر المحفوظ قبل تحميل React لمنع وميض الألوان عند فتح التطبيق
      (function () {
        try {
          var t = localStorage.getItem('animeverse_theme');
          if (t !== 'light' && t !== 'dark' && t !== 'system') t = 'dark';
          var r = t;
          if (t === 'system') {
            r = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var d = document.documentElement;
          d.classList.add(r);
          d.setAttribute('data-theme', r);
          d.style.colorScheme = r;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', r === 'light' ? '#f5f3fa' : '#0f0f14');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
