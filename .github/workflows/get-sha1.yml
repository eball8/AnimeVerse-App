name: Get SHA-1 Fingerprint

on:
  workflow_dispatch:

jobs:
  extract-sha1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

      - name: Extract SHA-1 and SHA-256
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -v -keystore release.keystore -alias $KEY_ALIAS -storepass $KEYSTORE_PASSWORD > keystore_info.txt
          echo "========== SHA-1 =========="
          grep -A 1 "SHA1:" keystore_info.txt
          echo "========== SHA-256 =========="
          grep -A 1 "SHA256:" keystore_info.txt
