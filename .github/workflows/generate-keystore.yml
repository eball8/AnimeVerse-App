name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias animeverse -keyalg RSA -keysize 2048 -validity 10000 -storepass animeverse123 -keypass animeverse123 -dname "CN=AnimeVerse, OU=Dev, O=AnimeVerse, L=Algeria, S=Algeria, C=DZ"
          base64 -w 0 release.keystore > keystore_base64.txt
          echo "===== KEYSTORE_BASE64_START ====="
          cat keystore_base64.txt
          echo ""
          echo "===== KEYSTORE_BASE64_END ====="
