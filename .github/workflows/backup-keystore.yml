name: Backup Keystore

on:
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Export encrypted backup
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          EXPORT_PASS: ${{ secrets.EXPORT_PASSPHRASE }}
        run: |
          set -euo pipefail
          mkdir bundle
          echo "$KEYSTORE_BASE64" | base64 -d > bundle/release.keystore
          {
            echo "alias=$KEY_ALIAS"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } > bundle/info.txt
          tar -czf bundle.tar.gz bundle
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in bundle.tar.gz -out keystore-backup.enc \
            -pass env:EXPORT_PASS
          ls -l keystore-backup.enc

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-encrypted
          path: keystore-backup.enc
          retention-days: 7
