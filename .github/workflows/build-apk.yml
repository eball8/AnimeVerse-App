name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_CLOUDINARY_CLOUD_NAME: ${{ secrets.VITE_CLOUDINARY_CLOUD_NAME }}
          VITE_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.VITE_CLOUDINARY_UPLOAD_PRESET }}
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Capacitor & Sync
        run: |
          npm install @capacitor/core@^7.0.0 @capacitor/cli@^7.0.0 @capacitor/android@^7.0.0 @capacitor/browser@^7.0.0 @capacitor-firebase/authentication@^7.0.0
          npx cap add android
          npx cap sync
          npx cap copy android

      - name: Copy Google Services JSON
        run: |
          cp android-config/google-services.json android/app/google-services.json

      - name: Generate App Icons
        run: |
          npm install @capacitor/assets
          npx capacitor-assets generate --android

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore

      - name: Inject Signing Config
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          node scripts/inject-signing.js

      - name: Inject Custom AndroidManifest
        run: |
          cp android-config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Inject Native Gallery Plugin
        run: |
          mkdir -p android/app/src/main/java/com/animeverse/app
          cp android-config/native/GalleryPlugin.java android/app/src/main/java/com/animeverse/app/GalleryPlugin.java
          cp android-config/native/GoogleHintPlugin.java android/app/src/main/java/com/animeverse/app/GoogleHintPlugin.java
          cp android-config/native/DeviceIdPlugin.java android/app/src/main/java/com/animeverse/app/DeviceIdPlugin.java
          cp android-config/native/MainActivity.java android/app/src/main/java/com/animeverse/app/MainActivity.java

      - name: Add Google Play Services Auth dependency
        run: |
          sed -i "/^dependencies {/a\    implementation 'com.google.android.gms:play-services-auth:21.2.0'" android/app/build.gradle
          grep -n "play-services-auth" android/app/build.gradle

      - name: Build APK with Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Diagnose Google Sign-In
        if: always()
        run: |
          echo "===== APK SIGNING CERTIFICATE ====="
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs android/app/build/outputs/apk/release/app-release.apk | grep -i "digest" || echo "APK not found"
          echo "===== default_web_client_id generated? ====="
          grep -rn "default_web_client_id" android/app/build/generated/res --include=values.xml || echo "NOT FOUND - google-services plugin NOT applied"
          echo "===== google-services in gradle files ====="
          grep -n "google-services" android/app/build.gradle android/build.gradle || echo "NO REFERENCE"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeVerse-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
