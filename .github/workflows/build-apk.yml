name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      # 1. بناء الويب
      - name: Build Web App
        run: npm run build

      # 2. إصلاح مسارات الملفات لتتوافق مع الأندرويد
      - name: Fix HTML Paths for Native
        run: |
          cd dist
          sed -i 's|src="/assets/|src="./assets/|g' index.html
          sed -i 's|href="/assets/|href="./assets/|g' index.html
          sed -i 's|src="/|src="./|g' index.html
          sed -i 's|href="/|href="./|g' index.html
          cd ..

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 3. تثبيت Capacitor ونسخ الملفات
      - name: Install Capacitor & Sync
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync
          npx cap copy android

      # 4. استبدال ملف الأذونات
      - name: Inject Custom AndroidManifest
        run: |
          cp android-config/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      # 5. بناء التطبيق
      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # 6. رفع الملف
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnimeVerse-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
