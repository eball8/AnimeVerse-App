name: Rotate Keystore

on:
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore and update secrets
        env:
          GH_TOKEN: ${{ secrets.ROTATE_PAT }}
          REPO: ${{ github.repository }}
          BACKUP_PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          PASS=$(openssl rand -base64 36 | tr -dc 'A-Za-z0-9' | head -c 24)
          echo "::add-mask::$PASS"
          keytool -genkeypair -keystore release.keystore -alias animeverse \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=AnimeVerse, O=AnimeVerse, C=DZ"
          B64=$(base64 -w0 release.keystore)
          echo "::add-mask::$B64"
          gh secret set KEYSTORE_BASE64 --repo "$REPO" --body "$B64"
          gh secret set KEYSTORE_PASSWORD --repo "$REPO" --body "$PASS"
          gh secret set KEY_PASSWORD --repo "$REPO" --body "$PASS"
          gh secret set KEY_ALIAS --repo "$REPO" --body "animeverse"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in release.keystore \
            -out keystore-backup.enc -pass env:BACKUP_PASS
          printf '%s' "$PASS" | openssl enc -aes-256-cbc -pbkdf2 -salt \
            -out password-backup.enc -pass env:BACKUP_PASS
          echo "=== البصمات الجديدة ==="
          keytool -list -v -keystore release.keystore -storepass "$PASS" | grep -E "SHA1:|SHA256:"

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: keystore-backup-encrypted
          path: |
            keystore-backup.enc
            password-backup.enc
          retention-days: 3
